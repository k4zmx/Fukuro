<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick capture</title>
<style>
@font-face{font-family:Commissioner;src:url('fonts/commissioner.woff2') format('woff2');font-weight:100 900}
:root{--bg:#fbf8f2;--ink:#1c1a17;--muted:#8a8274;--line:#d8cfbd;--chip:#efe9dd}
.dark{--bg:#211f1b;--ink:#ebe5d9;--muted:#8e8678;--line:#3a362f;--chip:#2c2924}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;font-family:Commissioner,system-ui,sans-serif}
.box{margin:10px;height:72px;display:flex;align-items:center;gap:14px;padding:0 18px 0 14px;border-radius:18px;background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px -12px #0007}
.owl{width:40px;height:40px;flex:none;background:url(build/icon.png) center/contain no-repeat}
input{flex:1;min-width:0;font:inherit;font-size:18px;font-weight:500;color:var(--ink);background:none;border:0;outline:none}
input::placeholder{color:var(--muted)}
.kind{flex:none;padding:4px 10px;border-radius:999px;background:var(--chip);font-size:12px;font-weight:700;color:var(--muted)}
.busy .kind{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.done input{font-size:15px}
.undo{display:none;flex:none;font:inherit;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.done.can-undo .undo{display:block}
.undo:hover{background:var(--chip)}
</style>
</head>
<body>
<div class="box"><span class="owl"></span><input id="q" placeholder="To-do · note … · -300 lunch · YouTube link · snip Title :: cmd" autocomplete="off" spellcheck="false"><span class="kind" id="k">To-do</span><button class="undo" id="u">Undo</button></div>
<script>
const q = document.getElementById('q'), k = document.getElementById('k'), box = document.querySelector('.box');
const PH = {off:'To-do · note … · -300 lunch · YouTube link · snip Title :: cmd', on:'Type anything · gym tomorrow 6pm · spent 300 on lunch · ALGO exam nov 3'};
let ai = false, state = 'type', hideTm = 0;
const kindOf = v => /youtu\.?be/.test(v) ? 'Video' : /^snip\s/i.test(v) ? 'Snippet' : /^note\s/i.test(v) ? 'Note' : /^([+-]\s*\d|(spent|paid|bought|earned|received|save)\s+\d)/i.test(v) ? 'Money' : ai ? 'Auto' : 'To-do';
function reset(){
  clearTimeout(hideTm); state = 'type';
  box.classList.remove('busy', 'done', 'can-undo');
  q.readOnly = false; q.value = ''; k.textContent = ai ? 'Auto' : 'To-do';
}
q.addEventListener('input', () => { if (state === 'type') k.textContent = kindOf(q.value); });
q.addEventListener('keydown', e => {
  if (e.key === 'Escape') { reset(); deskApp.captureHide(); return; }
  if (state === 'done') { reset(); return; }
  if (e.key === 'Enter' && state === 'type' && q.value.trim()) {
    state = 'busy'; box.classList.add('busy'); q.readOnly = true; k.textContent = 'Adding';
    deskApp.captureSubmit(q.value.trim());
    hideTm = setTimeout(() => { reset(); deskApp.captureHide(); }, 60000);
  }
});
document.getElementById('u').addEventListener('click', () => { deskApp.captureUndo(); reset(); deskApp.captureHide(); });
deskApp.onCaptureResult(r => {
  if (state !== 'busy') return;
  clearTimeout(hideTm); state = 'done';
  box.classList.remove('busy'); box.classList.add('done'); box.classList.toggle('can-undo', !!r.undo);
  q.value = r.text; k.textContent = r.fail ? 'Saved' : 'Added';
  hideTm = setTimeout(() => { reset(); deskApp.captureHide(); }, r.undo ? 3500 : 2200);
});
deskApp.onCaptureOpen((mode, on) => {
  let m = 'light'; try { m = JSON.parse(mode); } catch {}
  if (m === 'auto') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.classList.toggle('dark', m === 'dark');
  ai = !!on; q.placeholder = ai ? PH.on : PH.off;
  if (state !== 'busy') reset();
  q.focus(); q.select();
});
</script>
</body>
</html>
